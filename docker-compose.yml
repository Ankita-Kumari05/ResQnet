services:
  db:
    image: postgis/postgis:16-3.4
    container_name: resqnet_db
    environment:
      POSTGRES_DB: resqnet
      POSTGRES_USER: resqnet
      POSTGRES_PASSWORD: resqnet
    ports:
      - "5432:5432"
    volumes:
      - resqnet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqnet_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://resqnet:resqnet@db:5432/resqnet
      SYNC_DATABASE_URL: postgresql+psycopg2://resqnet:resqnet@db:5432/resqnet
      SECRET_KEY: resqnet-super-secret-key-change-in-production-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqnet_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  resqnet_db_data:
